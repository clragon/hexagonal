<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hexagonal preview host</title>
    <link rel="stylesheet" href="../dist/hexagonal-preflight.css" />
    <link rel="stylesheet" href="../dist/hexagonal-fonts.css" />
    <script type="module" src="../dist/hexagonal.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        box-sizing: border-box;
        padding: 32px 24px;
        font-family: var(--hex-font-family);
        color: var(--hex-fg-1);
        overflow: auto;
      }
      body.surface-card {
        background-color: var(--hex-bg-card);
        position: relative;
        isolation: isolate;
      }
      body.surface-card::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image: var(--hex-texture);
        background-repeat: repeat;
        -webkit-mask-image: var(--hex-texture-mask);
        mask-image: var(--hex-texture-mask);
      }
      body.surface-page {
        background-color: var(--hex-bg-page);
        background-image: var(--hex-tile);
        background-repeat: repeat;
      }
      body.surface-empty {
        padding: 0;
        background: transparent;
      }
      #stage {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        min-height: 100%;
      }
      body.surface-empty {
        padding: 0;
      }
      body.surface-empty #stage {
        align-items: stretch;
      }
      /* Surface components default to viewport-filling sizes; constrain in-preview */
      #stage hex-page,
      #stage hex-card,
      #stage hex-section,
      #stage hex-alert {
        min-height: auto;
        height: auto;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      const stage = document.getElementById("stage");

      // When the markup's top-level structure is the same as before (same
      // tags in the same order), reconcile attributes + inner content
      // in-place instead of replacing wholesale. This keeps long-lived
      // elements like an open <dialog> from being torn down + re-opened on
      // every keystroke in the parent's controls (which would steal focus
      // back to the iframe each time).
      function reconcile(newMarkup) {
        const tmp = document.createElement("div");
        tmp.innerHTML = newMarkup;

        const oldEls = Array.from(stage.children);
        const newEls = Array.from(tmp.children);
        const sameShape =
          oldEls.length === newEls.length &&
          oldEls.every((el, i) => el.tagName === newEls[i].tagName);

        if (!sameShape) {
          stage.innerHTML = newMarkup;
          return;
        }

        oldEls.forEach((oldEl, i) => {
          const newEl = newEls[i];
          for (const attr of Array.from(oldEl.attributes)) {
            if (!newEl.hasAttribute(attr.name)) oldEl.removeAttribute(attr.name);
          }
          for (const attr of Array.from(newEl.attributes)) {
            if (oldEl.getAttribute(attr.name) !== attr.value) {
              oldEl.setAttribute(attr.name, attr.value);
            }
          }
          if (oldEl.innerHTML !== newEl.innerHTML) {
            oldEl.innerHTML = newEl.innerHTML;
          }
        });
      }

      window.addEventListener("message", (e) => {
        if (e.data?.type === "hex-preview-content") {
          reconcile(e.data.markup ?? "");
          document.body.className = `surface-${e.data.surface ?? "card"}`;
        }
      });

      parent.postMessage({ type: "hex-preview-ready" }, "*");
    </script>
  </body>
</html>
